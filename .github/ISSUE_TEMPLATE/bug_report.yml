name: Relatório de Bug
description: Crie um relatório para nos ajudar a identificar e corrigir um problema.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigado por relatar o problema! Forneça o máximo de detalhes possível.
  - type: textarea
    id: what-happened
    attributes:
      label: Descrição do Bug
      description: Uma descrição clara e concisa do que ocorreu.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Passos para Reproduzir
      description: Como reproduzir o problema?
      placeholder: |
        1. Acesse '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportamento Esperado
      description: O que deveria ter acontecido.
    validations:
      required: true


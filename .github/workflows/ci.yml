name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore backend/ThiagoLavaCar.slnx

      - name: Build solution
        run: dotnet build backend/ThiagoLavaCar.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test backend/tests/ThiagoLavaCar.UnitTests/ThiagoLavaCar.UnitTests.csproj --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Typecheck and Build
        run: npm run build

      - name: Run Unit/Component Tests
        run: npm test
